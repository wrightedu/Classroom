name: Nitpick
description: Open an issue that is a minor suggestion, improvement, or observation
title: "[NITPICK] "
labels:
  - nitpick

body:
  - type: markdown
    attributes:
      value: |
        Use this form for issues that do not fit into one of the other available categories.

        Before continuing, please make sure your issue is not better suited as a bug report, feature request, documentation issue, or question.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue, request, or topic.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other relevant information, links, screenshots, or context.
    validations:
      required: false
