name: Bug Report
description: Report a problem or unexpected behavior with WSU Classroom
title: "[BUG] "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug with WSU Classroom!

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where did the issue occur?
      options:
        - Installation
        - WSU Classroom
        - Pilot CSV Parser
        - Repository Creation
        - Repository Access
        - Repository Cloning
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Provide the steps needed to reproduce the behavior.
      placeholder: |
        1. Run '...'
        2. Select '...'
        3. Enter '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: terminal-output
    attributes:
      label: Terminal Output
      description: If applicable, provide any relevant terminal output or error messages.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
